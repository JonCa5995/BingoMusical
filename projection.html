<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo Musical - Proyección</title>
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/utilities/animations.css">
  <link rel="stylesheet" href="css/modules/celebrations.css">
  <link rel="stylesheet" href="css/projection.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>

<body class="projection">
  <header id="projection-header" class="projection-header">
    <div class="projection-brand">
      <span id="projection-logo-slot" class="projection-logo-slot" aria-hidden="true"></span>
      <h1 class="projection-app-title">Bingo Musical</h1>
      <span id="projection-game-name" class="projection-game-name" hidden></span>
    </div>
    <p id="projection-counter" class="projection-counter"></p>
  </header>

  <div id="projection-logo" class="projection-logo" aria-hidden="true">
    <img class="logo-gray" src="img/icon-decorative.svg" alt="">
    <img class="logo-color" src="icon.png" alt="">
  </div>

  <div class="projection-body">
    <main class="projection-main" aria-live="polite">
      <p id="projection-status" class="projection-status"></p>
      <div id="projection-icon" class="projection-icon"></div>
      <h2 id="projection-title" class="projection-title"></h2>
      <div class="projection-player">
        <div id="projection-progress" class="projection-progress" role="progressbar" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="projection-progress-fill" class="projection-progress-fill"></div>
        </div>
        <p id="projection-time" class="projection-time">0:00 / 0:00</p>
      </div>
    </main>

    <section class="projection-side" aria-label="Canciones reproducidas">
      <div id="projection-history" class="projection-history" role="group" aria-label="Canciones reproducidas"></div>
      <p class="projection-hint">Doble clic para pantalla completa</p>
    </section>
  </div>

  <aside id="projection-celebration" class="celebration-overlay projection-celebration hidden" role="status" aria-labelledby="projection-celebration-title">
    <article class="celebration-content">
      <h1 id="projection-celebration-title" class="celebration-title"></h1>
      <p id="projection-celebration-text" class="celebration-text"></p>
      <div id="projection-celebration-rows" class="projection-celebration-rows"></div>
    </article>
  </aside>

  <script type="module" src="js/projection.js"></script>
</body>
</html>
